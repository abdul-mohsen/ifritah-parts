name: quality-gate

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parts
          POSTGRES_PASSWORD: parts_engine_pw
          POSTGRES_DB: parts_engine
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U parts -d parts_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: parts
      PGPASSWORD: parts_engine_pw
      PGDATABASE: parts_engine
      PGSSLMODE: disable
      DATA_DIR: ${{ github.workspace }}/data
      PORT: 8080
      BIND_ADDR: 127.0.0.1
      CORS_ORIGINS: http://127.0.0.1:8080
      QA_BASE_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply PostgreSQL migrations
        shell: bash
        run: |
          for file in db/migrations/*.sql; do
            psql "postgres://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/$PGDATABASE?sslmode=$PGSSLMODE" -f "$file"
          done

      - name: Import legacy catalog cache
        run: go run ./cmd/import_legacy_cache

      - name: Run Go tests
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build server
        run: go build -o server ./cmd/server

      - name: Start server
        shell: bash
        run: |
          nohup ./server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run QA gate
        run: go run ./cmd/qa_gate

      - name: Run Playwright regression
        working-directory: frontend
        run: npm run test:e2e -- story1-regression.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
            server.log
