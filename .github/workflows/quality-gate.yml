name: quality-gate

# Verifies:
#   1. Go tree builds + vets clean + all unit + handler tests pass
#   2. Postgres migrations apply cleanly on the same major version we ship
#   3. Frontend builds
#   4. Server boots against the seeded DB and /health responds
#   5. cmd/qa_gate passes against a live server
#   6. Playwright regression (mocked) passes
#
# MySQL/TecDoc is deliberately not started in CI. The optional connection
# stays disabled when MYSQL_HOST is empty, so the whole test surface here
# mirrors the "local dev + no big-data source" configuration operators run
# on their laptops.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Pinned to the SAME major version we ship in the runtime image
      # (see Dockerfile: postgres:17-alpine). Version drift here would let
      # a migration succeed in CI but fail in production.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parts
          POSTGRES_PASSWORD: parts_engine_pw
          POSTGRES_DB: parts_engine
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U parts -d parts_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: parts
      PGPASSWORD: parts_engine_pw
      PGDATABASE: parts_engine
      PGSSLMODE: disable
      DATA_DIR: ${{ github.workspace }}/data
      PORT: 8080
      BIND_ADDR: 127.0.0.1
      CORS_ORIGINS: http://127.0.0.1:8080
      QA_BASE_URL: http://127.0.0.1:8080
      # MySQL is mandatory in production; CI has no TecDoc source to seed,
      # so we bypass the hard-fail here. Every other environment (staging,
      # prod) must leave this unset — the server exits if MySQL is missing.
      ALLOW_NO_MYSQL: '1'
      # MySQL/TecDoc intentionally disabled — MYSQL_HOST unset →
      # internal/db/mysql.go returns nil and the TecDoc adapter stays inert.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Module + build cache reused across runs (cuts ~40 s on cold cache).
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply PostgreSQL migrations
        shell: bash
        run: |
          for file in db/migrations/*.sql; do
            psql "postgres://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/$PGDATABASE?sslmode=$PGSSLMODE" -f "$file"
          done

      - name: Import legacy catalog cache
        run: go run ./cmd/import_legacy_cache

      - name: Run Go tests
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build server
        run: go build -o server ./cmd/server

      - name: Start server
        shell: bash
        run: |
          nohup ./server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              curl -sS http://127.0.0.1:8080/health
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run QA gate
        run: go run ./cmd/qa_gate

      - name: Run Playwright regression
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium story1-regression.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
            server.log
