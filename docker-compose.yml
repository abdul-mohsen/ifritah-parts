# Parts Engine — single-container Compose file.
#
# The default `parts-engine` service is a SINGLE container that bundles
# Postgres + the Go server + the built React frontend. The Docker volume
# `pg-data` persists Postgres data across restarts; if you want a completely
# fresh DB, `docker compose down -v` will wipe it.
#
# The optional `elastic` profile still boots Elasticsearch + Kibana for
# TecDoc search experiments — enabled with `docker compose --profile elastic up`.

services:
  parts-engine:
    build: .
    container_name: parts-engine
    env_file:
      - path: .env
        required: false
    environment:
      # These need to be present for the embedded postgres init. If .env
      # overrides them, .env wins (env_file is evaluated first).
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: ${PGUSER:-parts}
      PGPASSWORD: ${PGPASSWORD:-parts_engine_pw}
      PGDATABASE: ${PGDATABASE:-parts_engine}
      PGSSLMODE: disable
      POSTGRES_USER: ${PGUSER:-parts}
      POSTGRES_PASSWORD: ${PGPASSWORD:-parts_engine_pw}
      POSTGRES_DB: ${PGDATABASE:-parts_engine}
      # The Go server ALWAYS listens on 8080 inside the container. `.env`'s
      # PORT is only used to pick the HOST-side port for the mapping below.
      # This override intentionally beats whatever PORT is in `.env` so we
      # never end up with docker forwarding to a port the server isn't on.
      PORT: '8080'
    ports:
      # HOST:CONTAINER — .env picks the host port (8081 in your case),
      # container port is fixed at 8080.
      - "${PORT:-8080}:8080"
      # Expose the embedded postgres for direct SQL access (psql, DBeaver, sqlc gen).
      # Remove this line if you want the DB purely internal.
      - "${PGHOST_PORT:-55432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Read-only seed data (SQLite hk_parts.db, vpic.lite.db, EPA data, etc.)
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # Healthcheck runs INSIDE the container, so it always hits :8080 —
      # the container's fixed internal port.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional Elasticsearch + Kibana for TecDoc search experimentation.
  # Enabled only with `docker compose --profile elastic up`.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: parts-es
    profiles: ["elastic"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: parts-kibana
    profiles: ["elastic"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  pg-data:
    driver: local
  es-data:
    driver: local
